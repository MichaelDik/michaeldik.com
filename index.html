<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Michael Dik - Solution Engineer, Writer, and Technologist">
    <title>Michael Dik</title>`
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="container">
        <div class="hero" style="display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap;">
            <div>
                <h1>Michael Dik</h1>
                <p>Solution Engineer at Galileo AI.</p>
            </div>
            <img src="profile.jpeg" alt="Michael Dik" style="width: 140px; height: 140px; border-radius: 10px; object-fit: cover; border: 2px solid var(--border-color);" />
        </div>

        <div class="content-section">
            <h2>About Me</h2>
            <p>
                I'm currently a Solution Engineer at <strong>Galileo AI</strong>, where I help customers scale safe and reliable AI. I'm passionate about technology, health, and fitness. 
            </p>
           
        </div>

    </div>

    <div id="footer-container"></div>

    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading navbar:', error));
    </script>
    <script>
        const footerPath = window.location.pathname.includes('/thoughts/') ? '../footer.html' : 'footer.html';
        fetch(footerPath)
            .then(response => response.text())
            .then(data => {
                const footerContainer = document.getElementById('footer-container');
                if (footerContainer) {
                    footerContainer.innerHTML = data;
                }
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>
</body>
</html>
