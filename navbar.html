<div class="navbar">
    <div class="nav-container">
        <a href="index.html" class="site-name">Michael Dik</a>
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a href="index.html" id="nav-home">Home</a>
            <!-- Writing section: links to thoughts.html -->
           <!-- <a href="thoughts.html" id="nav-thoughts">Writing</a> -->
            <a href="reading.html" id="nav-reading">Reading</a>
            <a href="about.html" id="nav-about">About</a>
            <img src="profile.jpeg" alt="Michael Dik" class="profile-pic" />
        </nav>
    </div>
</div>

<script>
    // Highlight active navigation link based on current page
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const navLinks = {
        'index.html': 'nav-home',
        'thoughts.html': 'nav-thoughts',
        'reading.html': 'nav-reading',
        'about.html': 'nav-about'
    };
    
    if (navLinks[currentPage]) {
        const activeLink = document.getElementById(navLinks[currentPage]);
        if (activeLink) {
            activeLink.classList.add('active');
        }
    }

    // Mobile menu toggle
    const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
    const navLinksElement = document.getElementById('nav-links');
    
    if (mobileMenuToggle && navLinksElement) {
        mobileMenuToggle.addEventListener('click', function() {
            this.classList.toggle('active');
            navLinksElement.classList.toggle('active');
        });

        // Close menu when a link is clicked
        const links = navLinksElement.querySelectorAll('a');
        links.forEach(link => {
            link.addEventListener('click', function() {
                mobileMenuToggle.classList.remove('active');
                navLinksElement.classList.remove('active');
            });
        });
    }
</script>
