<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Predictions and Forecasts by Michael Dik">
    <title>Predictions | Michael Dik</title>
    <link rel="stylesheet" href="../app.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="container">
        <h1>Predictions</h1>
        
        <div class="article-meta">
            <span>My thoughts on what's coming next</span>
        </div>

        <div class="content-section">
            <h2>No Timeline -  Technology Predictions</h2>
            
            <p>

                In our lifetimes, Manhattan will completely ban non-self driving cars. 

            </p>
    </div>

    <div id="footer-container"></div>

    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            })
            .catch(error => console.error('Error loading navbar:', error));
    </script>
    <script>
        const footerPath = window.location.pathname.includes('/thoughts/') ? '../footer.html' : 'footer.html';
        fetch(footerPath)
            .then(response => response.text())
            .then(data => {
                const footerContainer = document.getElementById('footer-container');
                if (footerContainer) {
                    footerContainer.innerHTML = data;
                }
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>
</body>
</html>
